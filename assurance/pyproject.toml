[project]
name = "rasp-assurance"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
classifiers = ["Private :: Do Not Upload"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project.scripts]
rasp-crashmap = "rasp_assurance.crashmaps:main"
rasp-evidence = "rasp_assurance.evidence:main"
rasp-device-farm = "rasp_assurance.farm:main"
