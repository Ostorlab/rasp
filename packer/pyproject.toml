[project]
name = "rasp-packer"
version = "0.4.4"
description = "Adds the RASP runtime to a built Android or iOS app"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.2",
    "lief==1.0.0",
]

[project.scripts]
rasp = "rasp_packer.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = [
    "scikit-build-core==1.1.2",
    "pybind11==3.1.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# The pure-Python packages ship alongside the compiled dexsplit._dex extension,
# which the top-level CMakeLists builds and installs into the dexsplit package.
wheel.packages = ["src/rasp_packer", "dexsplit/dexsplit"]
cmake.version = ">=3.18"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "dexsplit/dexsplit"]
mypy_path = ["src", "dexsplit"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_functions = ["test*"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]
