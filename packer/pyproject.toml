[project]
name = "rasp-packer"
version = "0.3.0"
description = "Adds the RASP runtime to a built Android or iOS app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.2",
    "lief==1.0.0",
    "protobuf==7.36.2",
]

[project.scripts]
rasp = "rasp_packer.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-protobuf==7.35.1.20260906",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
# Generated protobuf code (the aapt.pb schemas) is machine output, not hand-written source.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PT",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# The generated protobuf stubs (the aapt.pb schemas) are machine output; don't hold them to the
# strict rules. Their types stay available to the modules that import them.
[[tool.mypy.overrides]]
module = ["rasp_packer.android.aab.proto.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_functions = ["test*"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]
