name: Bug report
description: The packer fails, or a protected app crashes or reports something wrong.
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rasp version or commit
      placeholder: v0.4.4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The `rasp pack` command, the device or emulator and its OS version, and what you did in the app.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The packer's output, or the development build's log (`adb logcat` or the Xcode console).
      render: text
