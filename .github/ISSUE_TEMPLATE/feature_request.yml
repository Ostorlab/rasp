name: Feature request
description: A new check, a new signal, or a change to the packer or the plugin API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to detect or do, and why
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. For a check, what the runtime would observe on the device.
