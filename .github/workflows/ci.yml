name: Core verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install private packages and validation tools
        run: python -m pip install -e ./verifier -e ./hardener coverage==7.16.2 ruff==0.16.9
      - name: Reject Python syntax and undefined-name errors
        run: ruff check --isolated --select E9,F63,F7,F82 verifier hardener
      - name: Verifier tests and measured coverage floor
        working-directory: verifier
        run: |
          coverage run --branch --source=rasp_verifier -m unittest discover -s tests -t .
          coverage report --fail-under=80
          coverage xml -o coverage.xml
      - name: Prepare pinned Gradle and private JVM dependencies
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-7.3.3-bin.zip
          echo "b586e04868a22fd817c8971330fec37e298f3242eb85c374181b12d637f80302  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-7.3.3" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-cache" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          JAVA_HOME="$JAVA_HOME_17_X64" GRADLE_USER_HOME="$RUNNER_TEMP/gradle-cache" "$RUNNER_TEMP/gradle-7.3.3/bin/gradle" -p hardener/gradle-plugin --no-daemon build
      - name: Hardener tests and measured coverage floor
        working-directory: hardener
        run: |
          coverage run --branch --source=rasp_hardener -m unittest discover -s tests -t .
          coverage report --fail-under=90
          coverage xml -o coverage.xml
      - name: Native compilation, tests, and binary size gate
        run: bash .github/scripts/check-native.sh
      - name: Upload coverage evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            verifier/coverage.xml
            hardener/coverage.xml
          retention-days: 7
