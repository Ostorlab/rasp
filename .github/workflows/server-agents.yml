name: Private server agents
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sink-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Python real-sink tests
        working-directory: poc/server_agents/python
        run: python -m unittest discover -s tests -t . -v
      - name: Node real-sink tests
        working-directory: poc/server_agents/node
        run: npm test
