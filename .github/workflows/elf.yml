name: ELF protection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pack-and-enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev libssl-dev strace
      - name: Install packer and development tools
        run: python -m pip install -e './elf[dev]'
      - name: Lint, formatting and strict types
        working-directory: elf
        run: |
          ruff check rasp_elf tests
          ruff format --check rasp_elf tests
          mypy --strict --follow-untyped-imports rasp_elf
      - name: Packing, native enforcement and backend integration tests
        working-directory: elf
        run: python -m unittest discover -s tests -t . -v
