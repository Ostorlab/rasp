name: Compiler and JVM hardening

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compiler-and-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install matching LLVM and isolated Gradle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-7.3.3-bin.zip
          echo "b586e04868a22fd817c8971330fec37e298f3242eb85c374181b12d637f80302  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "LLVM_HOME=/usr/lib/llvm-18" >> "$GITHUB_ENV"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-7.3.3" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-cache" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Resolve and validate private plugin dependencies
        run: '"$GRADLE_HOME/bin/gradle" -p hardener/gradle-plugin --no-daemon build'
      - name: Compile, transform, verify IR and execute native and JVM artifacts
        working-directory: hardener
        run: python3 -m unittest tests.test_compiler tests.test_gradle_plugin tests.test_classloader tests.test_fault_detection -v
