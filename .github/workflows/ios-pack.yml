# Builds the obfuscated iOS runtime framework and packs an IPA with it, on the Xcode 27 runner.
#
# This is a manual (workflow_dispatch) job: it builds RaspRuntime.framework with O-MVLL obfuscation on
# (RASP_OBFUSCATE_IOS=ON), embeds it in the packer, packs the IPA you point it at, and uploads the packed
# (unsigned) IPA as an artifact. Signing and installing on a device are done separately -- the runner has no
# device and no signing identity. The IPA to pack is not committed; pass it as a base64 input, or adapt the
# "Fetch the app" step to download it from where you keep it.
name: iOS pack

on:
  workflow_dispatch:
    inputs:
      app_base64:
        description: "The IPA to pack, base64-encoded (e.g. `base64 -i app.ipa | pbcopy`)"
        required: true
        type: string
      build_id:
        description: "Build id written into the protected app"
        required: true
        type: string
      checks:
        description: "Comma-separated check groups (e.g. debugger,hooks,jailbreak)"
        required: false
        default: "debugger,hooks,jailbreak"
        type: string

env:
  CMAKE_VERSION: "4.4.1"

jobs:
  pack:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app
          xcodebuild -version

      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"

      - name: Configure (obfuscation on)
        working-directory: runtime
        run: cmake --preset ios -DRASP_OBFUSCATE_IOS=ON

      - name: Build the obfuscated framework
        working-directory: runtime
        run: cmake --build --preset ios --parallel

      - name: Check it built and is obfuscated
        working-directory: runtime
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          file "$binary" | grep -q "Mach-O 64-bit dynamically linked shared library arm64"
          # The jailbreak signal strings must not be readable in the obfuscated binary.
          test -z "$(strings -a "$binary" | grep -iF 'jailbreak_signal')"

      - name: Embed the framework in the packer
        working-directory: runtime
        run: |
          dest="../packer/src/rasp_packer/ios/resources"
          rm -rf "$dest/RaspRuntime.framework"
          cp -R build/ios/ios/RaspRuntime.framework "$dest/RaspRuntime.framework"
          ls -la "$dest/RaspRuntime.framework"

      - name: Install the packer
        working-directory: packer
        run: |
          python3 -m venv "$RUNNER_TEMP/packer"
          "$RUNNER_TEMP/packer/bin/pip" install .
          echo "$RUNNER_TEMP/packer/bin" >> "$GITHUB_PATH"

      - name: Decode the app
        run: |
          echo '${{ inputs.app_base64 }}' | base64 --decode > "$RUNNER_TEMP/app.ipa"
          file "$RUNNER_TEMP/app.ipa"

      - name: Pack the app
        run: |
          rasp pack "$RUNNER_TEMP/app.ipa" \
            --platform ios \
            --build-id '${{ inputs.build_id }}' \
            --checks '${{ inputs.checks }}' \
            --output "$RUNNER_TEMP/app-protected.ipa"

      - name: Upload the packed IPA
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-protected-ipa
          path: ${{ runner.temp }}/app-protected.ipa
          if-no-files-found: error
