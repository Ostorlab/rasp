# Builds the obfuscated iOS runtime framework and packs an IPA with it, on the Xcode 27 runner.
#
# This is a manual (workflow_dispatch) job: it builds RaspRuntime.framework with O-MVLL obfuscation on
# (RASP_OBFUSCATE_IOS=ON), embeds it in the packer, packs the IPA you point it at, and uploads the packed
# (unsigned) IPA as an artifact. Signing and installing on a device are done separately -- the runner has no
# device and no signing identity. The IPA to pack is not committed; pass its URL in app_url (preferred for real
# apps), or, for a tiny test app, pass it base64-encoded in app_base64.
name: iOS pack

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL to download the IPA from (preferred; use for real multi-MB apps)"
        required: false
        type: string
      app_base64:
        description: "The IPA base64-encoded (fallback for tiny test apps only; large apps get truncated)"
        required: false
        type: string
      build_id:
        description: "Build id written into the protected app"
        required: true
        type: string
      checks:
        description: "Comma-separated check groups (e.g. debugger,hooks,jailbreak)"
        required: false
        default: "debugger,hooks,jailbreak"
        type: string

env:
  CMAKE_VERSION: "4.4.1"

jobs:
  pack:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app
          xcodebuild -version

      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"

      - name: Configure (obfuscation on)
        working-directory: runtime
        run: cmake --preset ios -DRASP_OBFUSCATE_IOS=ON 2>&1 | tee "$RUNNER_TEMP/ios-configure.log"

      - name: Build the obfuscated framework
        working-directory: runtime
        run: cmake --build --preset ios --parallel

      - name: Check it built and is obfuscated
        working-directory: runtime
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          file "$binary" | grep -q "Mach-O 64-bit dynamically linked shared library arm64"
          # The canary checks that O-MVLL engaged and that the data-read skip list is intact, against real
          # signal names from omvll_config.py:
          #  - configure must report that the obfuscation pass engaged, so the framework is obfuscated.
          #  - 'dbg.traced' and 'sysctl' are skip-listed (read through data pointers), so they stay readable;
          #    if the skip list breaks, the string pass encrypts them and they vanish.
          # It does not assert any signal is absent: O-MVLL's string encryption is local to the uses it
          # rewrites, which varies by ABI and optimization, so a signal name can survive readable even with
          # obfuscation fully on (see the DATA_READ_LITERALS note in omvll_config.py).
          if ! grep -qF 'O-MVLL on; RaspRuntime is obfuscated' "$RUNNER_TEMP/ios-configure.log"; then
            echo "FAIL: configure did not report O-MVLL on; the framework is not obfuscated"; exit 1
          fi
          for literal in dbg.traced sysctl; do
            if ! strings -a "$binary" | grep -qF "$literal"; then
              echo "FAIL: '$literal' is missing; a data-read literal was encrypted (skip list broken?)"; exit 1
            fi
          done

      - name: Embed the framework in the packer
        working-directory: runtime
        run: |
          dest="../packer/src/rasp_packer/ios/resources"
          rm -rf "$dest/RaspRuntime.framework"
          cp -R build/ios/ios/RaspRuntime.framework "$dest/RaspRuntime.framework"
          ls -la "$dest/RaspRuntime.framework"

      - name: Install the packer
        working-directory: packer
        run: |
          python3 -m venv "$RUNNER_TEMP/packer"
          "$RUNNER_TEMP/packer/bin/pip" install .
          echo "$RUNNER_TEMP/packer/bin" >> "$GITHUB_PATH"

      - name: Fetch the app
        run: |
          if [ -n '${{ inputs.app_url }}' ]; then
            curl -fsSL -o "$RUNNER_TEMP/app.ipa" '${{ inputs.app_url }}'
          elif [ -n '${{ inputs.app_base64 }}' ]; then
            echo '${{ inputs.app_base64 }}' | base64 --decode > "$RUNNER_TEMP/app.ipa"
          else
            echo "Provide either app_url (preferred) or app_base64"; exit 1
          fi
          file "$RUNNER_TEMP/app.ipa"

      - name: Pack the app
        run: |
          rasp pack "$RUNNER_TEMP/app.ipa" \
            --platform ios \
            --build-id '${{ inputs.build_id }}' \
            --checks '${{ inputs.checks }}' \
            --output "$RUNNER_TEMP/app-protected.ipa"

      - name: Upload the packed IPA
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: app-protected-ipa
          path: ${{ runner.temp }}/app-protected.ipa
          if-no-files-found: error
