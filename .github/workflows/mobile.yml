name: Private mobile SDK validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter
        run: |
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Dart analysis and tests
        working-directory: flutter_rasp
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Android APK and JVM security regressions
        working-directory: sample_app
        run: |
          flutter pub get
          flutter build apk --debug
          cd android
          ./gradlew :flutter_rasp:testDebugUnitTest --console=plain
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Core crypto tests and iOS typecheck
        working-directory: flutter_rasp/ios
        run: |
          swift test
          xcodebuild -scheme RaspCore -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/rasp-ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Install pinned Flutter
        run: |
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Compile the private Flutter iOS adapter
        run: |
          flutter create --platforms=ios --org dev.ostorlab --empty "$RUNNER_TEMP/rasp_ios_smoke"
          cd "$RUNNER_TEMP/rasp_ios_smoke"
          flutter pub add flutter_rasp --path "$GITHUB_WORKSPACE/flutter_rasp"
          flutter build ios --simulator --no-codesign
