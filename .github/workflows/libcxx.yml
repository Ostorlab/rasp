name: Vendored libc++

on:
  pull_request:
    paths:
      - runtime/third_party/libcxx/**
      - .github/workflows/libcxx.yml
  push:
    branches: [main]
    paths:
      - runtime/third_party/libcxx/**
      - .github/workflows/libcxx.yml

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.4.4"

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime/third_party/libcxx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app
          xcodebuild -version
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Rebuild from source
        run: ./build.sh "$RUNNER_TEMP/fresh"
      - name: Check the committed archive matches the rebuild
        run: |
          mkdir -p "$RUNNER_TEMP/committed-x" "$RUNNER_TEMP/fresh-x"
          tar -xf libcxx-ios-arm64-iphoneos12.0-llvm23.1.3.tar.xz -C "$RUNNER_TEMP/committed-x"
          tar -xf "$RUNNER_TEMP"/fresh/libcxx-ios-arm64-iphoneos12.0-llvm23.1.3.tar.xz -C "$RUNNER_TEMP/fresh-x"
          diff -r "$RUNNER_TEMP/committed-x" "$RUNNER_TEMP/fresh-x"
