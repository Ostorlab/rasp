name: Private assurance tools
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  artifact-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./poc/assurance
      - run: python -m unittest discover -s poc/assurance/tests -t poc/assurance -v
# Device-farm adapters and private crash maps are intentionally not run/uploaded
# on public/untrusted pull-request events. Invoke the private commands in the
# operator-owned release pipeline with scoped credentials and provisioned devices.
