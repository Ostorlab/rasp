# Builds the iOS and Android runtimes from a pushed v<major>.<minor>.<patch> tag on main, checks them, and publishes a
# GitHub release of the tag with the packer's wheel, then the same wheel to PyPI. Nothing is published unless every
# step before it passed.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CMAKE_VERSION: "4.4.4"
  ANDROID_NDK_VERSION: "29.0.14206865"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag that is not on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "${GITHUB_REF_NAME} is not on main: a release is made from main"; exit 1; }
      - name: Read the version
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "The tag ${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>"; exit 1; }
          packer="$(python3 -c 'import tomllib; print(tomllib.load(open("packer/pyproject.toml", "rb"))["project"]["version"])')"
          runtime="$(sed -nE 's/^project\(rasp_runtime VERSION ([0-9.]+) .*/\1/p' runtime/CMakeLists.txt)"
          if [ "$packer" != "$runtime" ]; then
            echo "The packer's version ($packer) and the runtime's version ($runtime) differ"
            exit 1
          fi
          if [ "v${packer}" != "$GITHUB_REF_NAME" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the version ${packer}: bump the version, or fix the tag"
            exit 1
          fi
          echo "version=$packer" >> "$GITHUB_OUTPUT"
      - name: Refuse a tag that is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "${GITHUB_REF_NAME} is already released"
            exit 1
          fi

  ios-framework:
    needs: version
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app
          xcodebuild -version
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Pick this build's obfuscation seed
        run: |
          seed="$(python3 -c 'import secrets; print(secrets.randbits(31))')"
          echo "::add-mask::$seed"
          echo "RASP_OMVLL_SEED=$seed" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          set -o pipefail
          cmake --preset ios 2>&1 | tee "$RUNNER_TEMP/ios-configure.log"
      - name: Build
        run: cmake --build --preset ios --parallel
      - name: Check the framework is obfuscated
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          grep -qF 'O-MVLL on; RaspRuntime is obfuscated' "$RUNNER_TEMP/ios-configure.log" ||
            { echo "configure did not report O-MVLL on; the framework is not obfuscated"; exit 1; }
          for literal in dbg.traced sysctl syscall /var/jb i386; do
            strings -a "$binary" | grep -qxF "$literal" ||
              { echo "'$literal' is missing; a data-read literal was encrypted"; exit 1; }
          done
      - name: Check the framework
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          file "$binary" | grep -q "Mach-O 64-bit dynamically linked shared library arm64"
          test "$(otool -D "$binary" | tail -n 1)" = "@rpath/RaspRuntime.framework/RaspRuntime"
          test -z "$(nm -gU "$binary")"
          xcrun vtool -show-build "$binary" | grep -qxE ' *minos 12\.0'
          test -z "$(otool -L "$binary" | grep 'libc++')"
          test -z "$(nm "$binary" | grep -E 'rasp_start|observe_')"
      - name: Check the framework calls no forbidden function
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          imports="$(nm -u "$binary")"
          test -n "$imports"
          test -z "$(grep -xE '_(exit|_Exit|quick_exit|signal|sigaction|sigprocmask|pthread_sigmask|setenv|putenv|unsetenv|setlocale|setrlimit)' <<< "$imports")"
      - name: Check the framework writes no log
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          test -z "$(nm -u "$binary" | grep _os_log)"
          test -z "$(strings -a "$binary" | grep -F "{public}")"
      - name: Archive the framework
        run: tar -C build/ios/ios -czf "$RUNNER_TEMP/RaspRuntime.framework.tar.gz" RaspRuntime.framework
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-framework
          path: ${{ runner.temp }}/RaspRuntime.framework.tar.gz
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    name: android-runtime (${{ matrix.abi }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            file: "ELF 64-bit LSB shared object, ARM aarch64"
          - abi: armeabi-v7a
            file: "ELF 32-bit LSB shared object, ARM"
          - abi: x86_64
            file: "ELF 64-bit LSB shared object, x86-64"
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Select the NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -d "$ndk" || { echo "NDK $ANDROID_NDK_VERSION is not installed on this runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Pick this build's obfuscation seed
        run: |
          seed="$(python3 -c 'import secrets; print(secrets.randbits(31))')"
          echo "::add-mask::$seed"
          echo "RASP_OMVLL_SEED=$seed" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          set -o pipefail
          cmake --preset android -DANDROID_ABI=${{ matrix.abi }} | tee "$RUNNER_TEMP/android-configure.log"
      - name: Check the release build is obfuscated
        run: |
          for target in rasp rasp_core rasp_plugins; do
            grep -qF "O-MVLL on; ${target} is obfuscated" "$RUNNER_TEMP/android-configure.log" ||
              { echo "the release build does not obfuscate ${target}"; exit 1; }
          done
      - name: Build
        run: cmake --build --preset android --parallel
      - name: Check the library
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          lib=build/android/android/librasp.so
          file "$lib" | grep -qF "${{ matrix.file }}"
          test -z "$("$nm" -D --defined-only "$lib" | awk '{ print $3 }' | grep -vx 'JNI_OnLoad')"
          test -z "$("$readelf" -S "$lib" | grep -oE '\.symtab|\.debug_[a-z_]+')"
          "$readelf" --dynamic "$lib" | grep -q 'INIT_ARRAY'
          "$nm" -D -u "$lib" | awk '{ print $2 }' | sed 's/@.*//' | grep -qx 'JNI_GetCreatedJavaVMs'
      - name: Check the library calls no forbidden function
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          imports="$("$nm" -D -u build/android/android/librasp.so | awk '{ print $2 }' | sed 's/@.*//')"
          test -n "$imports"
          test -z "$(grep -xE '(exit|_Exit|quick_exit|signal|sigaction|sigprocmask|pthread_sigmask|setenv|putenv|unsetenv|setlocale|setrlimit)' <<< "$imports")"
      - name: Check the library writes no log
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          lib=build/android/android/librasp.so
          test -z "$("$nm" -D -u "$lib" | grep __android_log)"
          test -z "$(strings -a "$lib" | grep -F RaspRuntime)"
      - name: Check the library keeps the schedule's literals readable
        run: |
          lib=build/android/android/librasp.so
          literals="$(grep -rhoE '"((root|dbg|hook|mitm|integ|id|emu)\.[a-z_]+|rasp\.v2\.[a-z_.]*|assets/rasp/([a-z]+\.bin|r)|/(proc|sys)/[^"]+|TracerPid:|\.init|\.text|access|stat|getifaddrs|tun|tap)"' android/src | tr -d '"' | sort -u)"
          test -n "$literals"
          missing="$(comm -23 <(printf '%s\n' "$literals") <(strings -a -n 3 "$lib" | sort -u) || true)"
          if [ -n "$missing" ]; then
            echo "the string obfuscation encrypted literals the runtime reads through data pointers:"
            echo "$missing"
            exit 1
          fi
      - name: Stage the library
        run: |
          mkdir -p "$RUNNER_TEMP/android-runtime/lib/${{ matrix.abi }}"
          cp build/android/android/librasp.so "$RUNNER_TEMP/android-runtime/lib/${{ matrix.abi }}/librasp.so"
      - name: Build the stub
        if: matrix.abi == 'arm64-v8a'
        run: |
          jar="$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)"
          d8="$(ls "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -1)"
          ANDROID_JAR="$jar" D8="$d8" ./android/stub/build.sh "$RUNNER_TEMP/android-runtime"
          test -s "$RUNNER_TEMP/android-runtime/stub.dex"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-runtime-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-runtime
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, ios-framework, android-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FRAMEWORK_DIR: packer/src/rasp_packer/ios/resources
      ANDROID_DIR: packer/src/rasp_packer/android/resources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-framework
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: android-runtime-*
          path: ${{ runner.temp }}/android-runtime
          merge-multiple: true
      - name: Put the framework in the packer
        run: tar -C "$FRAMEWORK_DIR" -xzf "$RUNNER_TEMP/RaspRuntime.framework.tar.gz"
      - name: Put the Android runtime in the packer
        run: |
          rm -rf "${ANDROID_DIR:?}/lib" "${ANDROID_DIR:?}/stub.dex"
          mkdir -p "$ANDROID_DIR/lib"
          cp "$RUNNER_TEMP/android-runtime/stub.dex" "$ANDROID_DIR/stub.dex"
          cp -r "$RUNNER_TEMP/android-runtime/lib/." "$ANDROID_DIR/lib/"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Build the wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/build" packer
      - name: Tag the wheel manylinux
        run: |
          uvx --from auditwheel==6.6.0 --with patchelf==0.17.2.4 \
            auditwheel repair --wheel-dir "$RUNNER_TEMP/dist" "$RUNNER_TEMP"/build/*.whl
          uvx twine==6.2.0 check --strict "$RUNNER_TEMP"/dist/*.whl
      - name: Check that the packer installs with its version and runtimes
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          venv/bin/python -c 'import importlib.metadata, os
          installed = importlib.metadata.version("rasp-packer")
          assert installed == os.environ["VERSION"], installed'
          venv/bin/python -c 'from rasp_packer.ios import resources
          with resources.framework() as path: print(path)'
          venv/bin/python -c 'from rasp_packer.android import resources
          artifacts = resources.load()
          print(len(artifacts.stub_dex), sorted(artifacts.libraries))
          assert sorted(artifacts.libraries) == ["arm64-v8a", "armeabi-v7a", "x86_64"], sorted(artifacts.libraries)'
      - name: Pack the Android test app with the wheel
        run: |
          "$RUNNER_TEMP/venv/bin/rasp" pack --platform android --build-id "release-${VERSION}" \
            --output "$RUNNER_TEMP/packed.aab" packer/tests/apps/android/InsecureBankv2.aab
          libraries="$(unzip -Z1 "$RUNNER_TEMP/packed.aab" 'base/lib/*' | sort)"
          echo "$libraries"
          test "$(grep -c '\.so$' <<< "$libraries")" -eq 3
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel="$(basename "$RUNNER_TEMP"/dist/*.whl)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${wheel}"
          gh release create "v${VERSION}" "$RUNNER_TEMP/dist/${wheel}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v${VERSION}" \
            --generate-notes --notes "Install the packer, with its iOS and Android runtimes inside, on Linux x86_64 with Python 3.14:

          \`\`\`
          pip install ${url}
          \`\`\`"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: ${{ runner.temp }}/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  pypi:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/rasp-packer/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist
      - name: Publish the wheel to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
