name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CMAKE_VERSION: "4.4.4"

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "A release is made from main, not from ${GITHUB_REF}"
          exit 1
      - name: Read the version
        id: version
        run: |
          packer="$(python3 -c 'import tomllib; print(tomllib.load(open("packer/pyproject.toml", "rb"))["project"]["version"])')"
          runtime="$(sed -nE 's/^project\(rasp_runtime VERSION ([0-9.]+) .*/\1/p' runtime/CMakeLists.txt)"
          if [ "$packer" != "$runtime" ]; then
            echo "The packer's version ($packer) and the runtime's version ($runtime) differ"
            exit 1
          fi
          echo "version=$packer" >> "$GITHUB_OUTPUT"
      - name: Refuse a version that is already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "v${VERSION} is already released: bump the version first"
            exit 1
          fi

  ios-framework:
    needs: version
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app
          xcodebuild -version
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset ios
      - name: Build
        run: cmake --build --preset ios --parallel
      - name: Check the framework
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          file "$binary" | grep -q "Mach-O 64-bit dynamically linked shared library arm64"
          test "$(otool -D "$binary" | tail -n 1)" = "@rpath/RaspRuntime.framework/RaspRuntime"
          test -z "$(nm -gU "$binary")"
          xcrun vtool -show-build "$binary" | grep -qxE ' *minos 12\.0'
          test -z "$(otool -L "$binary" | grep 'libc++')"
      - name: Check the framework calls no forbidden function
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          imports="$(nm -u "$binary")"
          test -n "$imports"
          test -z "$(grep -xE '_(exit|_Exit|quick_exit|signal|sigaction|sigprocmask|pthread_sigmask|setenv|putenv|unsetenv|setlocale|setrlimit)' <<< "$imports")"
      - name: Check the framework writes no log
        run: test -z "$(nm -u build/ios/ios/RaspRuntime.framework/RaspRuntime | grep _os_log)"
      - name: Archive the framework
        run: tar -C build/ios/ios -czf "$RUNNER_TEMP/RaspRuntime.framework.tar.gz" RaspRuntime.framework
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-framework
          path: ${{ runner.temp }}/RaspRuntime.framework.tar.gz
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Select the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Log the Android toolchain versions
        run: |
          echo "NDK: $(sed -n 's/^Pkg.Revision = //p' "$ANDROID_NDK_HOME/source.properties") ($ANDROID_NDK_HOME)"
          echo "android.jar: $(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)"
          echo "d8: $(ls "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -1)"
      - name: Configure
        run: cmake --preset android
      - name: Build
        run: cmake --build --preset android --parallel
      - name: Check the library
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          re="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          lib=build/android/android/librasp.so
          file "$lib" | grep -q "ELF 64-bit LSB shared object, ARM aarch64"
          test -z "$("$nm" -D --defined-only "$lib" | awk '{ print $3 }' | grep -vx 'JNI_OnLoad')"
          test -z "$("$re" -S "$lib" | grep -oE '\.symtab|\.debug_[a-z_]+')"
      - name: Check the library calls no forbidden function
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          imports="$("$nm" -D -u build/android/android/librasp.so | awk '{ print $2 }' | sed 's/@.*//')"
          test -n "$imports"
          test -z "$(grep -xE '(exit|_Exit|quick_exit|signal|sigaction|sigprocmask|pthread_sigmask|setenv|putenv|unsetenv|setlocale|setrlimit)' <<< "$imports")"
      - name: Check the library writes no log
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          lib=build/android/android/librasp.so
          test -z "$("$nm" -D -u "$lib" | grep __android_log)"
          test -z "$(strings -a "$lib" | grep -F RaspRuntime)"
      - name: Build the stub
        run: |
          jar="$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)"
          d8="$(ls "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -1)"
          ANDROID_JAR="$jar" D8="$d8" ./android/stub/build.sh "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/stub.dex"
      - name: Stage the Android runtime artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/android-runtime/lib/arm64-v8a"
          cp "$RUNNER_TEMP/stub.dex" "$RUNNER_TEMP/android-runtime/stub.dex"
          cp build/android/android/librasp.so "$RUNNER_TEMP/android-runtime/lib/arm64-v8a/librasp.so"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-runtime
          path: ${{ runner.temp }}/android-runtime
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, ios-framework, android-runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FRAMEWORK_DIR: packer/src/rasp_packer/ios/resources
      ANDROID_DIR: packer/src/rasp_packer/android/resources
      PACKER_REPOSITORY_URL: https://us-central1-python.pkg.dev/api-project-609180564266/rasp-packer/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-framework
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-runtime
          path: ${{ runner.temp }}/android-runtime
      - name: Put the framework in the packer
        run: tar -C "$FRAMEWORK_DIR" -xzf "$RUNNER_TEMP/RaspRuntime.framework.tar.gz"
      - name: Put the Android runtime in the packer
        run: |
          mkdir -p "$ANDROID_DIR/lib"
          cp "$RUNNER_TEMP/android-runtime/stub.dex" "$ANDROID_DIR/stub.dex"
          cp -r "$RUNNER_TEMP/android-runtime/lib/." "$ANDROID_DIR/lib/"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - name: Check that the packer installs with its framework
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist" packer
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          venv/bin/python -c 'from rasp_packer.ios import resources
          with resources.framework() as path: print(path)'
      - name: Check that the packer installs with its Android runtime
        run: |
          cd "$RUNNER_TEMP"
          venv/bin/python -c 'from rasp_packer.android import resources
          artifacts = resources.load()
          print(len(artifacts.stub_dex), sorted(artifacts.libraries))'
      - name: Pack the test apps
        run: >-
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/pack_test_ipas.py
          packer/tests/apps/ios "$FRAMEWORK_DIR/RaspRuntime.framework"
      - name: Pack the Android test app
        run: >-
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/pack_test_apks.py
          packer/tests/apps/android "$ANDROID_DIR"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.RASP_PACKER_PUBLISHER_CREDENTIALS }}
      - name: Publish the packer to Artifact Registry
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
        run: >-
          UV_PUBLISH_PASSWORD="$(gcloud auth print-access-token)"
          uv publish --publish-url "$PACKER_REPOSITORY_URL" "$RUNNER_TEMP"/dist/*.whl
      - name: Commit the framework and tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FRAMEWORK_DIR/RaspRuntime.framework" "$ANDROID_DIR/stub.dex" "$ANDROID_DIR/lib"
          git commit -q -m "release: ${VERSION}"
          git tag "v${VERSION}"
          gh auth setup-git
          git push origin "refs/tags/v${VERSION}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --generate-notes --notes "Install the packer from Artifact Registry, signed in to Google Cloud with an account that can read it (see packer/README.md):

          \`\`\`
          pip install keyring keyrings.google-artifactregistry-auth
          pip install --force-reinstall --no-deps --index-url ${PACKER_REPOSITORY_URL}simple/ rasp-packer==${VERSION}
          pip install rasp-packer==${VERSION}
          \`\`\`"
