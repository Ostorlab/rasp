name: Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  LLVM_VERSION: "23"
  CMAKE_VERSION: "4.4.4"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CTEST_PARALLEL_LEVEL: "2"

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-format-${LLVM_VERSION}"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Check the formatting
        run: |
          clang-format --version
          git ls-files -z -- '*.h' '*.cpp' '*.mm' '*.h.in' | xargs -0 clang-format --dry-run --Werror

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-${LLVM_VERSION}" "clang-tidy-${LLVM_VERSION}"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset host
      - name: Check the code
        run: |
          clang-tidy --version
          run-clang-tidy -quiet -p build/host "^$PWD/(?!build/).*\.cpp$"

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-${LLVM_VERSION}"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset host
      - name: Build
        run: cmake --build --preset host --parallel
      - name: Tests
        run: ctest --preset host

  host-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-${LLVM_VERSION}" "libclang-rt-${LLVM_VERSION}-dev" "llvm-${LLVM_VERSION}"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset host-asan
      - name: Build
        run: cmake --build --preset host-asan --parallel
      - name: Tests
        run: ctest --preset host-asan

  host-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-${LLVM_VERSION}" "libclang-rt-${LLVM_VERSION}-dev" "llvm-${LLVM_VERSION}"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset host-tsan
      - name: Build
        run: cmake --build --preset host-tsan --parallel
      - name: Tests
        run: ctest --preset host-tsan

  ios:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.0.app
          xcodebuild -version
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Set up Java for the macOS host runner
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Context bridge with macOS system Bash
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          /bin/bash --version
          /bin/bash ./tests/android/context_bridge/run.sh
      - name: Check public own-task VM adapters with the actual macOS SDK and kernel
        run: |
          cmake --preset host -B "$RUNNER_TEMP/ios-vm-host"
          cmake --build "$RUNNER_TEMP/ios-vm-host" --parallel 2 \
            --target rasp_ios_provenance_vm_test rasp_ios_module_provenance_test
          ctest --test-dir "$RUNNER_TEMP/ios-vm-host" --parallel 2 --output-on-failure \
            --no-tests=error -R '^(IosVm|IosModuleProvenance)'
      - name: Configure
        # pipefail so a cmake failure fails this step with its own error, rather than tee masking it as exit 0
        # and the failure resurfacing later in Build or the canary with a misleading message.
        run: |
          set -o pipefail
          cmake --preset ios 2>&1 | tee "$RUNNER_TEMP/ios-configure.log"
      - name: Build
        run: cmake --build --preset ios --parallel
      - name: Check the framework is obfuscated
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          # The Release build defaults RASP_OBFUSCATE_IOS=ON. This catches a regression that disables O-MVLL
          # or breaks the data-read skip list:
          #  - configure must report that the obfuscation pass engaged, so the framework is obfuscated.
          #  - 'dbg.traced', 'sysctl' and '/var/jb' are skip-listed in omvll_config.py (read through data
          #    pointers), so they must stay readable; if the skip list breaks, the string pass encrypts them
          #    and they vanish. '/var/jb' is a jailbreak artifact path and 'i386' a simulator machine name,
          #    both iterated by the on-device checks ('i386' is the least arch-string-collision-prone of
          #    emulator.cpp's kSimulatorMachines under the exact-line match below).
          #    The match is exact-line (grep -qxF): the skip-listed 'sysctl' literal renders as its own
          #    'sysctl' line, distinct from the '_sysctl'/'_sysctlbyname' import lines, so the probe-source
          #    skip list gets real coverage rather than matching the imports a substring grep would.
          # It does not assert any signal is absent: O-MVLL's string encryption is local to the uses it
          # rewrites, which varies by ABI and optimization, so a signal name can survive readable even with
          # obfuscation fully on (see the DATA_READ_LITERALS note in omvll_config.py).
          if ! grep -qF 'O-MVLL on; RaspRuntime is obfuscated' "$RUNNER_TEMP/ios-configure.log"; then
            echo "FAIL: configure did not report O-MVLL on; the framework is not obfuscated"; exit 1
          fi
          strings -a "$binary" > "$RUNNER_TEMP/ios-data-read-literals.txt"
          for literal in dbg.traced sysctl /var/jb i386 hook.exec_modules hook.exec_modules_meta dyld_v1; do
            if ! grep -qxF "$literal" "$RUNNER_TEMP/ios-data-read-literals.txt"; then
              echo "FAIL: '$literal' is missing; a data-read literal was encrypted (skip list broken?)"; exit 1
            fi
          done
      - name: Check the framework
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          file "$binary" | grep -q "Mach-O 64-bit dynamically linked shared library arm64"
          test "$(otool -D "$binary" | tail -n 1)" = "@rpath/RaspRuntime.framework/RaspRuntime"
          ./tests/ios/capture/check_framework.sh build/ios/ios/RaspRuntime.framework "$RUNNER_TEMP/ios-capture-release"
          xcrun vtool -show-build "$binary" | grep -qxE ' *minos 12\.0'
          nm -u "$binary" | awk '{ print $NF }' > "$RUNNER_TEMP/ios-vm-imports.txt"
          test -z "$(grep -xE '_mach_vm_(read_overwrite|region)' "$RUNNER_TEMP/ios-vm-imports.txt")"
          test -z "$(otool -L "$binary" | grep 'libc++')"
      - name: Check the framework calls no forbidden function
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          imports="$(nm -u "$binary")"
          test -n "$imports"
          test -z "$(grep -xE '_(exit|_Exit|quick_exit|signal|sigaction|sigprocmask|pthread_sigmask|setenv|putenv|unsetenv|setlocale|setrlimit)' <<< "$imports")"
      - name: Check the framework writes no log
        run: |
          binary=build/ios/ios/RaspRuntime.framework/RaspRuntime
          test -z "$(nm -u "$binary" | grep _os_log)"
          test -z "$(strings -a "$binary" | grep -F "{public}")"
      - name: Stage and validate capability-bound release
        run: |
          cmake --install build/ios --prefix "$RUNNER_TEMP/runtime-release" --component runtime
          binary="$RUNNER_TEMP/runtime-release/rasp_packer/ios/resources/RaspRuntime.framework/RaspRuntime"
          python3 tools/capabilities.py verify "$binary" ios arm64 12.0
          "$RUNNER_TEMP/build-tools/bin/pip" install 'lief==1.0.0'
          "$RUNNER_TEMP/build-tools/bin/python" tools/verify_packaging.py "$binary" ios arm64
      - name: Configure the development build with the private storage plugin consumer
        run: cmake --preset ios-dev -DRASP_PLUGINS=tests/plugins/private_storage
      - name: Build the development build
        run: cmake --build --preset ios-dev --parallel
      - name: Install clang-tidy
        env:
          LLVM_RELEASE: "23.1.3"
          LLVM_SHA256: a3f181b1176406893c097443e21b2a54b85afeac2d10eca3b6d251e6dca32eb3
        run: |
          archive="LLVM-${LLVM_RELEASE}-macOS-ARM64"
          curl -fsSL -o "$RUNNER_TEMP/llvm.tar.zst" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_RELEASE}/${archive}.tar.zst"
          echo "${LLVM_SHA256}  $RUNNER_TEMP/llvm.tar.zst" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/llvm"
          zstd -dc --long=31 "$RUNNER_TEMP/llvm.tar.zst" | tar -x -C "$RUNNER_TEMP/llvm" --strip-components 1 \
            "${archive}/bin/clang-tidy" "${archive}/bin/run-clang-tidy" "${archive}/lib/clang"
          rm "$RUNNER_TEMP/llvm.tar.zst"
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
      - name: Check the iOS code
        run: |
          clang-tidy --version
          run-clang-tidy -quiet -p build/ios-dev "^$PWD/ios/src/.*\.(cpp|mm)$"
      - name: Check development capture ABI and build the actual UIKit host
        run: |
          ./tests/ios/capture/check_framework.sh build/ios-dev/ios/RaspRuntime.framework "$RUNNER_TEMP/ios-capture-debug"
          cmake -S tests/ios/capture/host -B "$RUNNER_TEMP/ios-capture-host" -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DRASP_FRAMEWORK="$PWD/build/ios-dev/ios/RaspRuntime.framework"
          cmake --build "$RUNNER_TEMP/ios-capture-host" --parallel 2
          host="$RUNNER_TEMP/ios-capture-host/CaptureHost.app"
          xcrun vtool -show-build "$host/CaptureHost" | grep -qxE ' *minos 12\.0'
          cmp build/ios-dev/ios/RaspRuntime.framework/RaspRuntime "$host/Frameworks/RaspRuntime.framework/RaspRuntime"
          cmake -S tests/ios/local_policy/host -B "$RUNNER_TEMP/ios-policy-host" -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DRASP_FRAMEWORK="$PWD/build/ios-dev/ios/RaspRuntime.framework"
          cmake --build "$RUNNER_TEMP/ios-policy-host" --parallel 2
          policy_host="$RUNNER_TEMP/ios-policy-host/PolicyHost.app"
          xcrun vtool -show-build "$policy_host/PolicyHost" | grep -qxE ' *minos 12\.0'
          cmp build/ios-dev/ios/RaspRuntime.framework/RaspRuntime "$policy_host/Frameworks/RaspRuntime.framework/RaspRuntime"
      - name: Fetch immutable PL05 for the combined Apple consumer gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ostorlab/rasp-plugins
          ref: 1197b25162eadc202799abfe16008bef390e3482
          path: runtime/build/rt19-plugin-sources
          persist-credentials: false
      - name: Build selected provenance and frozen PL05 with actual Apple SDK and consumers
        run: |
          plugins="$PWD/build/rt19-plugin-sources"
          profile='{"host":"collector.example","mode":"system","pins":null,"port":443,"validity":null,"version":1}'
          settings="$(python3 -c 'import json,sys; print(json.dumps([{"name":"RASP_REPORTING_ENDPOINT","value":"https://collector.example/apis/graphql"},{"name":"RASP_REPORTING_SECURITY_PROFILE","value":sys.argv[1]}]))' "$profile")"
          for preset in ios ios-dev; do
            build="build/$preset-provenance-pl05"
            cmake --preset "$preset" -B "$build" \
              -DRASP_PLUGINS="$plugins/plugins/reporting;$plugins/plugins/dns_reporting" \
              -DRASP_REPORTING_ENDPOINT=https://collector.example/apis/graphql \
              -DRASP_REPORTING_SECURITY_PROFILE="$profile" -DRASP_DNS_REPORTING_ZONE=r.example
            cmake --build "$build" --parallel 2
            stage="$RUNNER_TEMP/$preset-provenance-pl05"
            cmake --install "$build" --prefix "$stage" --component runtime
            framework="$stage/rasp_packer/ios/resources/RaspRuntime.framework"
            binary="$framework/RaspRuntime"
            ./tests/ios/capture/check_framework.sh "$framework" "$stage/abi"
            nm -u "$binary" | awk '{ print $NF }' > "$stage/vm-imports.txt"
            test -z "$(grep -xE '_mach_vm_(read_overwrite|region)' "$stage/vm-imports.txt")"
            xcrun vtool -show-build "$binary" | grep -qxE ' *minos 12\.0'
            python3 tools/capabilities.py verify "$binary" ios arm64 12.0
            "$RUNNER_TEMP/build-tools/bin/python" tools/verify_packaging.py "$binary" ios arm64
            python3 "$plugins/scripts/publish_packer/security.py" verify "$binary" ios "$settings"
            if [ "$preset" = ios ]; then
              strings -a "$binary" > "$stage/data-read-literals.txt"
              for literal in hook.exec_modules hook.exec_modules_meta dyld_v1; do
                grep -qxF "$literal" "$stage/data-read-literals.txt"
              done
            fi
            for consumer in capture local_policy; do
              host="$RUNNER_TEMP/$preset-$consumer-pl05"
              cmake -S "tests/ios/$consumer/host" -B "$host" -G "Unix Makefiles" \
                -DCMAKE_BUILD_TYPE=Debug -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
                -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
                -DRASP_FRAMEWORK="$framework"
              cmake --build "$host" --parallel 2
              if [ "$consumer" = capture ]; then name=CaptureHost; else name=PolicyHost; fi
              xcrun vtool -show-build "$host/$name.app/$name" | grep -qxE ' *minos 12\.0'
              cmp "$binary" "$host/$name.app/Frameworks/RaspRuntime.framework/RaspRuntime"
            done
            run-clang-tidy -quiet -p "$build" "^$PWD/ios/src/.*\.(cpp|mm)$"
          done
      - name: Check the development build writes logs
        run: nm -u build/ios-dev/ios/RaspRuntime.framework/RaspRuntime | grep -q _os_log

  android:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            file: "ELF 64-bit LSB shared object, ARM aarch64"
          - abi: armeabi-v7a
            file: "ELF 32-bit LSB shared object, ARM, EABI5"
          - abi: x86_64
            file: "ELF 64-bit LSB shared object, x86-64"
          - abi: x86
            file: "ELF 32-bit LSB shared object, Intel 80386"
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install "cmake==${CMAKE_VERSION}"
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
      - name: Install LLVM
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-tidy-${LLVM_VERSION}"
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Select the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset android -DANDROID_ABI=${{ matrix.abi }}
      - name: Build
        run: cmake --build --preset android --parallel
      - name: Check the Android code
        run: run-clang-tidy -quiet -p build/android "^$PWD/android/src/.*\.cpp$"
      - name: Check the library
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          lib=build/android/android/librasp.so
          file "$lib" | grep -qF "${{ matrix.file }}"
          "$nm" -D --defined-only "$lib" | awk '{ print $3 }' | LC_ALL=C sort > "$RUNNER_TEMP/android-exports.txt"
          printf '%s\n' JNI_OnLoad rasp_local_policy_gate_v1 rasp_local_policy_info_v1 > "$RUNNER_TEMP/android-expected-exports.txt"
          diff -u "$RUNNER_TEMP/android-expected-exports.txt" "$RUNNER_TEMP/android-exports.txt"
          test -z "$("$readelf" -S "$lib" | grep -oE '\.symtab|\.debug_[a-z_]+')"
          "$readelf" --dynamic "$lib" | grep -q 'INIT_ARRAY'
          "$nm" -D -u "$lib" | awk '{ print $2 }' | sed 's/@.*//' | grep -qx 'JNI_GetCreatedJavaVMs'
      - name: Check the library calls no forbidden function
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          imports="$("$nm" -D -u build/android/android/librasp.so | awk '{ print $2 }' | sed 's/@.*//')"
          test -n "$imports"
          test -z "$(grep -xE '(exit|_Exit|quick_exit|signal|sigaction|sigprocmask|pthread_sigmask|setenv|putenv|unsetenv|setlocale|setrlimit)' <<< "$imports")"
      - name: Check the library writes no log
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          lib=build/android/android/librasp.so
          test -z "$("$nm" -D -u "$lib" | grep __android_log)"
          test -z "$(strings -a "$lib" | grep -F RaspRuntime)"
      - name: Stage and validate capability-bound release
        run: |
          cmake --install build/android --prefix "$RUNNER_TEMP/runtime-release" --component runtime
          binary="$RUNNER_TEMP/runtime-release/rasp_packer/android/resources/lib/${{ matrix.abi }}/librasp.so"
          python3 tools/capabilities.py verify "$binary" android '${{ matrix.abi }}' 31
          "$RUNNER_TEMP/build-tools/bin/pip" install 'lief==1.0.0'
          "$RUNNER_TEMP/build-tools/bin/python" tools/verify_packaging.py "$binary" android '${{ matrix.abi }}'
      - name: Link installed primitive C and C++ policy consumers
        run: bash tests/android/local_policy/check_library.sh "$RUNNER_TEMP/runtime-release" '${{ matrix.abi }}' "$RUNNER_TEMP/policy-release"
      - name: Configure the development build with the private storage plugin consumer
        run: cmake --preset android-dev -DANDROID_ABI=${{ matrix.abi }} -DRASP_PLUGINS=tests/plugins/private_storage
      - name: Build the development build
        run: cmake --build --preset android-dev --parallel
      - name: Check the Android development code
        run: run-clang-tidy -quiet -p build/android-dev "^$PWD/android/src/.*\.cpp$"
      - name: Check the development build writes logs
        run: |
          nm="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nm" -D -u build/android-dev/android/librasp.so | grep -q __android_log_write
      - name: Stage development and link primitive policy consumers
        run: |
          cmake --install build/android-dev --prefix "$RUNNER_TEMP/runtime-debug" --component runtime
          bash tests/android/local_policy/check_library.sh "$RUNNER_TEMP/runtime-debug" '${{ matrix.abi }}' "$RUNNER_TEMP/policy-debug"
      - name: Build the stub
        run: |
          jar="$(ls -d "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)"
          d8="$(ls "$ANDROID_HOME"/build-tools/*/d8 | sort -V | tail -1)"
          ANDROID_JAR="$jar" D8="$d8" ./android/stub/build.sh "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/stub.dex"
          ANDROID_JAR="$jar" ANDROID_BUILD_TOOLS="$(dirname "$d8")" bash tests/android/local_policy/device/build.sh "$RUNNER_TEMP/policy-host" "$RUNNER_TEMP/runtime-bridge-compile-only.jar"
