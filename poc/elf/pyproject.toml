[project]
name = "rasp-elf"
version = "0.1.0"
description = "ELF binary packing, runtime instrumentation, and reference backend verification"
requires-python = ">=3.10"
dependencies = ["lief>=0.17,<2", "cryptography>=42"]

[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.10", "coverage>=7"]

[project.scripts]
rasp-elf = "rasp_elf.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rasp_elf*"]

[tool.setuptools.data-files]
"share/rasp-elf/runtime" = ["runtime/rasp_runtime.c", "runtime/rasp_runtime.h"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "PLW1510", "BLE"]

[tool.ruff.lint.isort]
force-single-line = true
